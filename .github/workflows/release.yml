name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 2. Linux Server Build (x86_64, aarch64)
  # ============================================================================
  build-server-linux:
    name: Build Linux Server (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_name: nami-server-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            archive_name: nami-server-linux-aarch64.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build Release Binary (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path server/Cargo.toml

      - name: Build Release Binary (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path server/Cargo.toml

      - name: Package Binary Archive
        shell: bash
        run: |
          BIN="server/target/${{ matrix.target }}/release/nami-server"
          chmod +x "$BIN"
          tar -czf "${{ matrix.archive_name }}" -C "$(dirname "$BIN")" nami-server

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  # ============================================================================
  # 3. Windows Server Build (x86_64)
  # ============================================================================
  build-server-windows:
    name: Build Windows Server (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build Release Binary
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $bin = "server\target\release\nami-server.exe"
          Compress-Archive -Path $bin -DestinationPath "nami-server-windows-x86_64.zip" -Force

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nami-server-windows-x86_64.zip
          path: nami-server-windows-x86_64.zip
          if-no-files-found: error

  # ============================================================================
  # 4. Docker Multi-Arch Image (ghcr.io)
  # ============================================================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nami-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================================
  # 5. Publish Unified GitHub Release
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs:
      - build-server-linux
      - build-server-windows
      - build-docker

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Release Assets
        shell: bash
        run: |
          mkdir -p dist
          find release-artifacts -type f -name "nami-server-linux-x86_64.tar.gz" -exec cp {} dist/ \;
          find release-artifacts -type f -name "nami-server-linux-aarch64.tar.gz" -exec cp {} dist/ \;
          find release-artifacts -type f -name "nami-server-windows-x86_64.zip" -exec cp {} dist/ \;
          cp deploy/install.sh dist/install.sh
          cp deploy/install.ps1 dist/install.ps1
          ls -la dist/

      - name: Generate Release Notes Body
        id: release_notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          cat << EOF > release_body.md
          ## 🌊 Nami Release ${TAG}

          ### 🆕 Что нового в релизе:
          * **Безопасность:**
            * Устранена XSS в панели владельца веб-клиента: имя пользователя с апострофом выходило из JS-строки внутри \`onclick\` и выполняло произвольный код в сессии владельца.
            * Отзыв ссылки «поделиться» теперь проверяет владельца — раньше любой авторизованный пользователь мог погасить чужую ссылку, зная её токен.
            * Загрузка обложек определяет тип по сигнатуре файла: \`image/svg+xml\` проходил проверку и отдавался обратно как исполняемый документ.
            * Токен устройства перенесён из query-строки в заголовок \`Authorization\` — URL с токеном оседал в системных логах Android и в логах прокси.
            * Content-Security-Policy на веб-клиенте и странице настройки.
          * **Совместное прослушивание (Jam):**
            * Переход организатора в другую комнату больше не бросает свою: гости получают уведомление о закрытии, комната освобождается.
            * Анонимные гости (вход по коду) получают отдельные права — раньше подключение одного гостя отбирало доступ у другого.
            * Зависшие соединения закрываются по таймауту и больше не удерживают комнату бесконечно.
            * Очередь джема ограничена 200 треками.
            * Переподключение с нарастающей паузой вместо попытки каждые 3 секунды.
          * **Синхронизация:**
            * Исправлено задвоение статистики прослушиваний при обратной синхронизации.
            * Исправлен порядок треков в плейлистах между устройствами.
            * Сопоставление треков с сервером кешируется — раньше вся библиотека целиком уезжала на сервер при каждой синхронизации.
          * **Обложки:**
            * Новая обложка отображается сразу, без перезапуска приложения.
            * Оборванная загрузка больше не оставляет битый файл, который считался валидным кешем навсегда.
            * Устранена гонка при параллельном скачивании одной обложки.
          * **Плеер:**
            * Скачанный трек считается локальным — он играет с накопителя, и сеть ему не нужна.
            * Новая плашка показывает, есть ли трек на сервере, отдельно от того, откуда он играет.
            * Удаление трека только с сервера с сохранением скачанной копии на устройстве.
          * **Установщик сервера:**
            * Интерактивный TUI с выбором режима доступа.
            * Режим домена настраивает Caddy с автоматическим сертификатом Let's Encrypt: \`/setup\` открывается сразу по \`https://ваш-домен\` без предупреждений браузера.
            * Порты брандмауэра открываются по подтверждению и в зависимости от выбранного режима.
          * **Веб-клиент:** оформление приведено к дизайн-системе приложения, светлая и тёмная темы с переключателем.
          * **Версия Android-клиента:** \`0.1.2-beta.21\`.
          * **Версия сервера:** \`1.0.10\`.

          ### 📦 Артефакты релиза:
          * **Android Client:**
            * \`app-release.apk\` — Hi-Res / Bit-perfect аудиоплеер Nami для Android.
          * **Сервер Nami (Self-Hosted):**
            * \`nami-server-linux-x86_64.tar.gz\` — бинарник для Linux x86_64 (Ubuntu, Debian, Arch, Fedora).
            * \`nami-server-linux-aarch64.tar.gz\` — бинарник для Linux ARM64 (Raspberry Pi 4/5, Oracle Cloud ARM, Apple Silicon VPS).
            * \`nami-server-windows-x86_64.zip\` — бинарник для Windows 10/11 и Windows Server (x64).
            * \`install.sh\` / \`install.ps1\` — скрипты мгновенной установки сервера в одну команду.
          * **Docker Image:**
            * \`ghcr.io/${{ github.repository_owner }}/nami-server:latest\`
            * \`ghcr.io/${{ github.repository_owner }}/nami-server:${TAG}\`

          ### 🚀 Быстрая установка сервера:
          * **Linux (systemd):**
            \`\`\`bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/install.sh | bash
            \`\`\`
          * **Windows (PowerShell от имени Администратора):**
            \`\`\`powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/install.ps1 | iex
            \`\`\`
          * **Docker:**
            \`\`\`bash
            docker run -d --name nami -p 4533:4533 -v /path/to/music:/music:ro -v nami-data:/data ghcr.io/${{ github.repository_owner }}/nami-server:latest
            \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nami ${{ github.ref_name }}"
          body_path: release_body.md
          generate_release_notes: true
          files: |
            dist/nami-server-linux-x86_64.tar.gz
            dist/nami-server-linux-aarch64.tar.gz
            dist/nami-server-windows-x86_64.zip
            dist/install.sh
            dist/install.ps1
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
