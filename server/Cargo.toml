[package]
name = "nami-server"
version = "1.0.6"
edition = "2021"
description = "Self-hosted сервер NAMI - библиотека и passthrough-отдача аудио"

[dependencies]
axum = { version = "0.8", features = ["ws", "http1", "http2", "json", "tokio"] }
# tls-rustls-no-provider вместо tls-rustls: провайдер выбираем сами (ring, не aws-lc-rs).
# aws-lc-rs тянет cmake+bindgen и делает кросс-компиляцию arm64 отдельным приключением,
# ring для этого собирается обычным кросс-gcc.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = "0.5"
# Уже приезжает транзитивно с axum; объявляем явно ради BodyExt в потоковой загрузке.
http-body-util = "0.1"
tower-http = { version = "0.7", features = ["fs"] }

# rusqlite вместо sqlx: цель "1 ядро / 512 МБ" - sqlx тянет async-пул, макросы и
# заметно больше зависимостей, а вся работа с БД здесь короткая и синхронная.
rusqlite = { version = "0.40", features = ["bundled"] }

lofty = "0.25"
walkdir = "2"
# default-features выключены: нужен только модуль system (CPU/RAM), без сети/дисков/процессов.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

getrandom = "0.4"
# Хеш паролей людей (у устройств токены случайные, им хеш пароля не нужен).
# default-features выключены: нужен чистый Rust-бэкенд без alloc-зависимостей сверху.
argon2 = "0.5"
sha2 = "0.11"
hex = "0.4"
rcgen = "0.14"
# без default-features: нужен только SVG-рендер, растровый бэкенд тянет весь крейт image.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# Исходящий HTTP (LRCLIB, DeepL, MusicBrainz). ureq, а не reqwest: он синхронный, а все
# походы наружу и так живут в spawn_blocking, и его rustls собирается на ring - том же
# провайдере, что уже линкуется для TLS сервера, без второй криптобиблиотеки в образе.
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
# MD5 нужен ровно для одного: исторический токен Subsonic - md5(пароль + соль).
# Свой безопасностью он не является и нигде больше не используется (см. subsonic.rs).
md-5 = { version = "0.11.0", default-features = false }

# Встраивание PWA-клиента в бинарник: статика из web/dist компилируется в сервер.
rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
