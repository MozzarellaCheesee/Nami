# Пример конфигурации сервера NAMI. Скопировать в config.toml (в git не попадает).
# Любое поле переопределяется переменной окружения - удобно для Docker.

# NAMI_PORT
port = 4533

# NAMI_MUSIC_DIRS - список через ';' (Windows-пути тоже работают)
music_dirs = ["/music"]

# NAMI_DB_PATH
db_path = "nami.db"

# NAMI_DATA_DIR - куда кладётся самоподписанный TLS-сертификат
data_dir = "."

# NAMI_TLS - HTTPS с самоподписанным сертификатом (его отпечаток уходит в QR).
# false имеет смысл только для локальной отладки curl'ом.
tls = true

# NAMI_WATCH - слежение за music_dirs (inotify/FSEvents/ReadDirectoryChangesW).
# Изменения подхватываются сами, ручной POST /api/scan остаётся как запасной путь.
watch = true

# NAMI_TRANSCODE_CACHE_DIR - готовые транскоды. Относительный путь считается от data_dir.
transcode_cache_dir = "transcode_cache"

# NAMI_TRANSCODE_CACHE_MB - потолок кеша, старейшие файлы вытесняются.
transcode_cache_mb = 2048

# Сколько дней хранятся tombstone-записи синхронизации до физического удаления.
tombstone_ttl_days = 30

# NAMI_UPLOAD_DIR - куда ложатся файлы, присланные клиентами (POST /api/tracks/upload).
# Относительный путь считается от data_dir. Внутри заводится подпапка на библиотеку,
# и она сканируется вместе с music_dirs - иначе пересканирование удалило бы загруженное.
upload_dir = "uploads"
